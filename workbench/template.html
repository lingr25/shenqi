<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神祇读神奇 · 方舟底层机制工作台</title>
<style>
:root{
  --bg:#07090d; --bg2:#0b0f16; --panel:#0e141d; --panel2:#111927;
  --line:#1c2735; --line2:#27364a;
  --txt:#d7e0ea; --dim:#8fa0b3; --faint:#5b6b7d;
  --acc:#45e0b8; --acc2:#f5c542; --acc3:#6ea8fe; --danger:#ff6b81;
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,"Courier New",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.7;
  background-image:
    linear-gradient(rgba(69,224,184,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(69,224,184,.025) 1px,transparent 1px);
  background-size:44px 44px;}
::selection{background:rgba(69,224,184,.28)}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
mark{background:rgba(245,197,66,.32);color:#ffe9a8;border-radius:2px;padding:0 1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 22px;background:rgba(7,9,13,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
#logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#logo .glyph{width:30px;height:30px;border:1px solid var(--acc);border-radius:7px;display:grid;place-items:center;
  color:var(--acc);font-family:var(--mono);font-size:15px;box-shadow:0 0 14px rgba(69,224,184,.25) inset}
#logo small{display:block;font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:1.5px;font-weight:400}
#nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
#nav a{color:var(--dim);padding:6px 13px;border-radius:7px;font-size:14px;border:1px solid transparent}
#nav a:hover{color:var(--txt);text-decoration:none;background:var(--panel)}
#nav a.on{color:var(--acc);border-color:rgba(69,224,184,.35);background:rgba(69,224,184,.07)}
#gsearch{position:relative}
#gsearch input{width:230px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);
  border-radius:8px;padding:7px 12px 7px 32px;font-size:13px;outline:none;font-family:inherit}
#gsearch input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(69,224,184,.15)}
#gsearch::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--faint);font-size:15px}
#gsearch kbd{position:absolute;right:8px;top:8px;font-size:10px;color:var(--faint);border:1px solid var(--line2);
  border-radius:4px;padding:0 5px;font-family:var(--mono)}

/* ---------- layout ---------- */
#view{max-width:1240px;margin:0 auto;padding:26px 22px 80px}
.grid{display:grid;gap:14px}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h3{font-size:15px;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:8px;height:8px;background:var(--acc);border-radius:2px;box-shadow:0 0 8px var(--acc)}
.dim{color:var(--dim)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.small{font-size:12.5px}

/* ---------- hero ---------- */
#hero{padding:44px 34px 34px;border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;
  background:radial-gradient(900px 300px at 15% -10%,rgba(69,224,184,.09),transparent),
             radial-gradient(700px 260px at 90% 0%,rgba(110,168,254,.07),transparent),
             linear-gradient(180deg,var(--panel),var(--bg2))}
#hero .kicker{font-family:var(--mono);color:var(--acc);font-size:12px;letter-spacing:3px;margin-bottom:10px}
#hero h1{font-size:32px;line-height:1.35;margin-bottom:10px}
#hero h1 em{font-style:normal;color:var(--acc)}
#hero p.sub{color:var(--dim);max-width:760px}
.statband{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.stat .n{font-family:var(--mono);font-size:26px;color:var(--acc);font-weight:700}
.stat .n.gold{color:var(--acc2)} .stat .n.blue{color:var(--acc3)}
.stat .l{font-size:12px;color:var(--faint);letter-spacing:1px}
.startpath{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.startpath a{border:1px solid var(--line2);border-radius:9px;padding:9px 16px;color:var(--txt);font-size:13.5px;background:var(--panel)}
.startpath a:hover{border-color:var(--acc);text-decoration:none;box-shadow:0 0 16px rgba(69,224,184,.12)}
.startpath a b{color:var(--acc);font-family:var(--mono);margin-right:7px}

/* ---------- topic cards ---------- */
.topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:linear-gradient(180deg,var(--panel),var(--bg2));
  position:relative;transition:border-color .15s, transform .15s;display:block;color:var(--txt)}
.tcard:hover{border-color:var(--tc,var(--acc));text-decoration:none;transform:translateY(-2px)}
.tcard .tc-name{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.tcard .tc-dot{width:10px;height:10px;border-radius:3px;background:var(--tc,var(--acc));box-shadow:0 0 9px var(--tc,var(--acc))}
.tcard .tc-en{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:1.5px;margin:2px 0 8px}
.tcard .tc-intro{font-size:12.5px;color:var(--dim);min-height:40px}
.tcard .tc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--mono);font-size:12px}
.tcard .tc-count{color:var(--tc,var(--acc));font-weight:700;font-size:15px}
.trackbar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:10px;background:var(--line)}
.trackbar i{display:block;height:100%}

/* ---------- entry card ---------- */
.entry{border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,var(--panel),var(--bg2));
  padding:15px 18px;margin-bottom:12px;position:relative}
.entry:hover{border-color:var(--line2)}
.entry .e-claim{font-size:15.5px;font-weight:650;line-height:1.75}
.entry .e-sc{margin-top:7px;font-size:13px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 16px}
.entry .e-sc b{color:var(--faint);font-weight:400;font-size:11.5px;letter-spacing:1px;margin-right:5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.bdg{font-size:11px;border-radius:5px;padding:2px 8px;border:1px solid var(--line2);color:var(--dim);
  font-family:var(--mono);white-space:nowrap}
.bdg.topic{color:var(--tc);border-color:color-mix(in srgb,var(--tc) 40%,transparent)}
.bdg.tr-vod_official{color:#6ea8fe;border-color:rgba(110,168,254,.4)}
.bdg.tr-vod_cloud{color:#9d8cff;border-color:rgba(157,140,255,.4)}
.bdg.tr-qq{color:#f5c542;border-color:rgba(245,197,66,.4)}
.bdg.tr-mixed_or_unknown{color:#e08bd0;border-color:rgba(224,139,208,.4)}
.bdg.userver{color:#ffd97a;border-color:rgba(245,197,66,.6);background:rgba(245,197,66,.08)}
.bdg.agentver{color:var(--faint)}
.bdg.repair{color:#ff9e64;border-color:rgba(255,158,100,.45)}
.bdg.ent{cursor:pointer;color:var(--acc3)}
.bdg.ent:hover{border-color:var(--acc3)}
.e-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--dim);border-radius:7px;
  padding:4px 12px;font-size:12px;font-family:var(--mono)}
.btn:hover{color:var(--acc);border-color:var(--acc)}
.evidence{margin-top:12px;border-top:1px dashed var(--line2);padding-top:12px;display:none}
.entry.open .evidence{display:block}
.quote{border-left:2px solid var(--line2);padding:8px 0 8px 14px;margin:8px 0;font-size:13.5px;color:var(--dim)}
.quote .q-text{color:#c3cfdb}
.quote .q-meta{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tschip{font-family:var(--mono);font-size:11.5px;color:var(--acc);border:1px solid rgba(69,224,184,.4);
  border-radius:5px;padding:1px 8px;background:rgba(69,224,184,.06)}
.tschip:hover{text-decoration:none;background:rgba(69,224,184,.15)}
.qtag{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.quote.qq{border-left-color:rgba(245,197,66,.5);background:rgba(245,197,66,.03);border-radius:0 8px 8px 0}
.review-reason{margin-top:10px;font-size:12.5px;color:var(--faint);background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;padding:10px 13px;display:none}
.entry.showr .review-reason{display:block}

/* ---------- topics reading view ---------- */
.tplayout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.tprail{position:sticky;top:70px}
.tprail a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;
  color:var(--dim);font-size:13.5px;border:1px solid transparent}
.tprail a:hover{color:var(--txt);background:var(--panel);text-decoration:none}
.tprail a.on{color:var(--txt);border-color:var(--line2);background:var(--panel)}
.tprail a .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.chapter-head{border-left:3px solid var(--tc,var(--acc));padding:6px 0 6px 18px;margin-bottom:18px}
.chapter-head h2{font-size:24px}
.chapter-head .en{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:2px}
.chapter-head p{color:var(--dim);margin-top:8px;max-width:820px;font-size:14px}
.subcat{margin:22px 0 10px;font-size:14px;color:var(--tc,var(--acc));font-family:var(--mono);
  display:flex;align-items:center;gap:10px}
.subcat::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- facets ---------- */
.searchlayout{display:grid;grid-template-columns:215px 1fr;gap:20px;align-items:start}
.facet{margin-bottom:18px}
.facet h4{font-size:12px;color:var(--faint);letter-spacing:1.5px;margin-bottom:8px;font-family:var(--mono)}
.fchip{display:inline-block;margin:0 6px 6px 0;border:1px solid var(--line2);border-radius:6px;
  padding:3px 10px;font-size:12px;color:var(--dim);cursor:pointer;background:transparent}
.fchip:hover{color:var(--txt)}
.fchip.on{color:var(--acc);border-color:var(--acc);background:rgba(69,224,184,.08)}
#searchbox{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:10px;
  padding:12px 16px;font-size:16px;outline:none;font-family:inherit}
#searchbox:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(69,224,184,.12)}
#resmeta{color:var(--faint);font-size:12.5px;font-family:var(--mono);margin:12px 2px}

/* ---------- constants ---------- */
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th{text-align:left;color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:1px;
  padding:8px 10px;border-bottom:1px solid var(--line2)}
.ctable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable tr:hover td{background:rgba(69,224,184,.03)}
.ctable .cv{font-family:var(--mono);color:var(--acc);font-size:12.5px}
.ctable .cq{cursor:pointer}
.ctable .cq:hover{color:var(--acc)}
.numchip{display:inline-block;margin:0 7px 7px 0;border:1px solid var(--line2);border-radius:7px;padding:5px 11px;
  font-family:var(--mono);font-size:12.5px;color:var(--txt);cursor:pointer;background:var(--panel)}
.numchip:hover{border-color:var(--acc2);color:var(--acc2)}
.numchip b{color:var(--acc2)}
.numchip .c{color:var(--faint);font-size:11px;margin-left:7px}

/* ---------- entities ---------- */
.entchip{display:inline-block;margin:0 7px 7px 0;border:1px solid var(--line2);border-radius:7px;padding:5px 12px;
  font-size:13px;color:var(--txt);cursor:pointer;background:var(--panel)}
.entchip:hover{border-color:var(--acc3);color:var(--acc3);text-decoration:none}
.entchip .c{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}

/* ---------- misc ---------- */
.notice{border:1px solid rgba(245,197,66,.35);background:rgba(245,197,66,.05);border-radius:10px;
  padding:12px 16px;font-size:13px;color:#e8d9ae;margin-bottom:18px}
.notice b{color:var(--acc2)}
#footer{border-top:1px solid var(--line);padding:26px 22px 40px;color:var(--faint);font-size:12px;
  max-width:1240px;margin:0 auto;line-height:1.9}
.hist{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.hist .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.hist .bar i{width:100%;max-width:64px;background:linear-gradient(180deg,var(--acc),rgba(69,224,184,.25));
  border-radius:4px 4px 0 0;display:block}
.hist .bar span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.hist .bar b{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{color:var(--txt)}
@media(max-width:900px){.tplayout,.searchlayout{grid-template-columns:1fr}.tprail{position:static}
 #gsearch{display:none}#hero h1{font-size:24px}}
</style>
</head>
<body>
<div id="topbar">
  <div id="logo">
    <div class="glyph">⌬</div>
    <div>神祇机制工作台<small>ARKNIGHTS MECHANICS WORKBENCH</small></div>
  </div>
  <nav id="nav">
    <a href="#/overview" data-nav="overview">总览</a>
    <a href="#/topics" data-nav="topics">专题讲义</a>
    <a href="#/search" data-nav="search">检索终端</a>
    <a href="#/constants" data-nav="constants">常数速查</a>
    <a href="#/entities" data-nav="entities">实体索引</a>
    <a href="#/about" data-nav="about">关于</a>
  </nav>
  <div id="gsearch"><input id="gsearch-input" placeholder="搜索机制 / 干员 / 黑话…"><kbd>Ctrl K</kbd></div>
</div>
<div id="view"></div>
<div id="footer"></div>
<script id="db" type="application/json">__DB_JSON__</script>
<script>
"use strict";
/* ============================================================
   神祇读神奇 · 方舟底层机制工作台  (auto-generated, offline SPA)
   ============================================================ */
const DB = JSON.parse(document.getElementById('db').textContent);
const ENTRIES = DB.entries;
const BY_ID = {}; ENTRIES.forEach(e => BY_ID[e.i] = e);
const TOPICS = DB.topics;
const TP_BY_ID = {}; TOPICS.forEach(t => TP_BY_ID[t.id] = t);

const TRACK_META = {
  vod_official:{label:'录播 · 官方字幕', cls:'tr-vod_official', color:'#6ea8fe'},
  vod_cloud:{label:'录播 · 云端ASR', cls:'tr-vod_cloud', color:'#9d8cff'},
  qq:{label:'群聊实测 · QQ', cls:'tr-qq', color:'#f5c542'},
  qq_chat:{label:'群聊实测 · QQ', cls:'tr-qq', color:'#f5c542'},
  mixed_or_unknown:{label:'双轨混合', cls:'tr-mixed_or_unknown', color:'#e08bd0'},
};
const SCOPE_LABEL = {universal:'通用机制', general_mechanism:'通用机制', entity_mechanism:'实体机制', instance:'特例实例', '未标注':'未标注'};
const ENT_TYPE_LABEL = {operator:'干员', enemy:'敌人', mechanic:'机制术语', device:'装置/道具', status:'状态', shenqi_slang:'神祇黑话', slang:'圈内黑话', untyped:'其他'};

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

/* ---------- search engine ---------- */
function entryText(e){ return (e.c+' '+e.s+' '+e.k+' '+e.cat+' '+(e.ents||[]).join(' ')).toLowerCase(); }
const TEXT_CACHE = ENTRIES.map(entryText);
function searchEntries(query, facets){
  query = (query||'').trim().toLowerCase();
  const tokens = query ? query.split(/\s+/) : [];
  const res = [];
  for (let i=0;i<ENTRIES.length;i++){
    const e = ENTRIES[i];
    if (facets){
      if (facets.topic && e.tp !== facets.topic) continue;
      if (facets.track){
        if (facets.track==='vod'){ if (e.tr!=='vod_official'&&e.tr!=='vod_cloud') continue; }
        else if (facets.track==='qq'){ if (e.tr!=='qq'&&e.tr!=='qq_chat') continue; }
        else if (e.tr!==facets.track) continue;
      }
      if (facets.review && e.rv !== facets.review) continue;
      if (facets.scope && e.sc !== facets.scope) continue;
    }
    if (!tokens.length){ res.push({e, score:0}); continue; }
    let score = 0, ok = true;
    for (const t of tokens){
      const inClaim = e.c.toLowerCase().includes(t);
      const inSubj  = e.s.toLowerCase().includes(t);
      const inCond  = e.k.toLowerCase().includes(t);
      const inEnt   = (e.ents||[]).some(x=>x.toLowerCase().includes(t));
      const inQuote = e.qtext.includes(t);
      const inCat   = e.cat.toLowerCase().includes(t);
      if (!(inClaim||inSubj||inCond||inEnt||inQuote||inCat)){ ok=false; break; }
      score += inClaim?6:0; score += inSubj?5:0; score += inEnt?4:0; score += inCond?2:0; score += inCat?2:0; score += inQuote?1:0;
    }
    if (ok) res.push({e, score});
  }
  if (tokens.length) res.sort((a,b)=>b.score-a.score);
  return res;
}
function highlight(text, query){
  let out = esc(text);
  const tokens = (query||'').trim().split(/\s+/).filter(Boolean);
  for (const t of tokens){
    if (!t) continue;
    const pat = t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try { out = out.replace(new RegExp('('+pat+')','gi'), '\u0001$1\u0002'); } catch(_){}
  }
  return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
}

/* ---------- components ---------- */
function trackBadge(e){
  const tm = TRACK_META[e.tr] || TRACK_META.mixed_or_unknown;
  return `<span class="bdg ${tm.cls}">${tm.label}</span>`;
}
function topicBadge(e){
  const t = TP_BY_ID[e.tp];
  return `<span class="bdg topic" style="--tc:${t.color}">${t.name}</span>`;
}
function entryCard(e, query, showTopic){
  const evCount = e.ev.reduce((n,c)=>n+c.q.length,0);
  const vodCites = e.ev.filter(c=>c.bv);
  const userV = e.rv === 'user_verified';
  let html = `<div class="entry" id="ent-${enc(e.i)}">
    <div class="e-claim">${highlight(e.c, query)}</div>
    <div class="e-sc">
      <span><b>对象</b>${highlight(e.s, query)}</span>
      <span><b>条件</b>${highlight(e.k, query)}</span>
    </div>
    <div class="badges">
      ${showTopic?topicBadge(e):''}
      ${e.cat!==TP_BY_ID[e.tp].name?`<span class="bdg">${esc(e.cat)}</span>`:''}
      ${trackBadge(e)}
      <span class="bdg">${SCOPE_LABEL[e.sc]||esc(e.sc)}</span>
      ${e.ym?`<span class="bdg">录得 ${esc(String(e.ym)).replace(/(\d{4})(\d{2})/,'$1-$2')}</span>`:''}
      ${userV?`<span class="bdg userver">★ 用户认证</span>`:`<span class="bdg agentver">代理审核·文本层</span>`}
      ${e.rp?`<span class="bdg repair" title="派生文本存在基于同源上下文的订正记录">派生订正</span>`:''}
      ${(e.ents||[]).slice(0,6).map(n=>`<span class="bdg ent" data-act="ent" data-v="${esc(n)}">${esc(n)}</span>`).join('')}
    </div>
    <div class="e-actions">
      <button class="btn" data-act="toggle">▶ 证据链 ×${evCount}${vodCites.length?' · 含原片定位':''}</button>
      <button class="btn" data-act="review">审核理由</button>
      <a class="btn" href="#/entry/${enc(e.i)}">永久链接</a>
    </div>
    <div class="evidence">${e.ev.map(c=>citeHtml(c, query)).join('')}</div>
    <div class="review-reason">${esc(e.rr||'')}</div>
  </div>`;
  return html;
}
function citeHtml(c, query){
  const isQQ = c.kind === 'qq';
  const head = isQQ
    ? `<span class="qtag">QQ 群聊窗口 ${esc(c.wid||'')}</span>${c.asof?`<span class="qtag">截至 ${esc(c.asof)}</span>`:''}${c.nmsg?`<span class="qtag">${c.nmsg} 条原文</span>`:''}`
    : `<span class="qtag">${c.cloud?'云端ASR重转写':'官方AI字幕'}</span><span class="qtag mono">${esc(c.file||'')}</span>`;
  const quotes = c.q.map(q=>{
    let ts = '';
    if (q.t != null && c.bv){
      const url = `https://www.bilibili.com/video/${c.bv}/?p=${c.part||1}&t=${Math.floor(q.t)}`;
      ts = `<a class="tschip" href="${url}" target="_blank" rel="noopener">▶ ${esc(q.l||fmtT(q.t))} · ${c.bv}${c.part&&c.part>1?' P'+c.part:''}</a>`;
    } else if (q.t != null){
      ts = `<span class="tschip">${esc(q.l||fmtT(q.t))}</span>`;
    }
    return `<div class="quote ${isQQ?'qq':''}">
      <div class="q-text">${highlight(q.x, query)}</div>
      <div class="q-meta">${ts}${isQQ?'<span class="qtag">已脱敏 · 不含群号/QQ号/昵称</span>':''}</div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:6px">${head}</div>${quotes}`;
}
function fmtT(s){ s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

function trackBarHTML(counts){
  const total = Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const order = [['vod_official'],['vod_cloud'],['qq','qq_chat'],['mixed_or_unknown']];
  return `<div class="trackbar">`+ order.map(keys=>{
    const n = keys.reduce((a,k)=>a+(counts[k]||0),0);
    if(!n) return '';
    const tm = TRACK_META[keys[0]];
    return `<i style="width:${(n/total*100).toFixed(1)}%;background:${tm.color}" title="${tm.label} ${n}"></i>`;
  }).join('') + `</div>`;
}
function trackCounts(list){
  const c = {}; list.forEach(e=>{ c[e.tr]=(c[e.tr]||0)+1; }); return c;
}
</script>
